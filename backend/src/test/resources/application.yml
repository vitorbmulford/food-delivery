auth:
  jwt:
    secret: VGhpc0lzQVN0cm9uZ1Rlc3RTZWNyZXRLZXlGb3JIUzI1Ng==
    issuer: foody-delivery-test
    expiration-seconds: 3600
    allowed-origin: http://localhost:5173
spring:
  jpa:
    open-in-view: false
geocoding:
  nominatim:
    # Integration tests must never call the public Nominatim service.
    base-url: http://127.0.0.1:1
    user-agent: "foody-delivery-test/1.0 (contact: test@example.com)"
    connect-timeout: 50ms
    read-timeout: 50ms
app:
  geocoding-resilience:
    retry:
      max-attempts: 2
      initial-delay: 1ms
      max-delay: 5ms
      multiplier: 2.0
      jitter: 0.0
    circuit-breaker:
      sliding-window-size: 4
      minimum-number-of-calls: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 250ms
      permitted-calls-in-half-open-state: 1
  rate-limit:
    login: { capacity: 1000, period: 1m }
    register: { capacity: 1000, period: 1m }
    geocoding: { capacity: 1000, period: 1m }
    bucket-idle-ttl: 1m
    max-buckets: 100
