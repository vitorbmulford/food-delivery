spring:
  application:
    name: foody-delivery-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foody_delivery}
    username: ${SPRING_DATASOURCE_USERNAME:foody}
    password: ${SPRING_DATASOURCE_PASSWORD:foody_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:foody-delivery}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
geocoding:
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: "${NOMINATIM_USER_AGENT:foody-delivery/1.0 (contact: admin@example.com)}"
    connect-timeout: ${NOMINATIM_CONNECT_TIMEOUT:2s}
    read-timeout: ${NOMINATIM_READ_TIMEOUT:5s}
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    root: INFO
    com.foody: INFO
