spring:
  application:
    name: foody-delivery-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foody_delivery}
    username: ${SPRING_DATASOURCE_USERNAME:foody}
    password: ${SPRING_DATASOURCE_PASSWORD:foody_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:foody-delivery}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
geocoding:
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: "${NOMINATIM_USER_AGENT:foody-delivery/1.0 (contact: admin@example.com)}"
    connect-timeout: ${NOMINATIM_CONNECT_TIMEOUT:2s}
    read-timeout: ${NOMINATIM_READ_TIMEOUT:5s}
app:
  geocoding-resilience:
    retry:
      max-attempts: ${NOMINATIM_RETRY_MAX_ATTEMPTS:3}
      initial-delay: ${NOMINATIM_RETRY_INITIAL_DELAY:1s}
      max-delay: ${NOMINATIM_RETRY_MAX_DELAY:5s}
      multiplier: ${NOMINATIM_RETRY_MULTIPLIER:2.0}
      jitter: ${NOMINATIM_RETRY_JITTER:0.2}
    circuit-breaker:
      sliding-window-size: ${NOMINATIM_CIRCUIT_WINDOW:10}
      minimum-number-of-calls: ${NOMINATIM_CIRCUIT_MIN_CALLS:5}
      failure-rate-threshold: ${NOMINATIM_CIRCUIT_FAILURE_RATE:50}
      wait-duration-in-open-state: ${NOMINATIM_CIRCUIT_OPEN_DURATION:30s}
      permitted-calls-in-half-open-state: ${NOMINATIM_CIRCUIT_HALF_OPEN_CALLS:2}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
      period: ${RATE_LIMIT_LOGIN_PERIOD:1m}
    register:
      capacity: ${RATE_LIMIT_REGISTER_CAPACITY:5}
      period: ${RATE_LIMIT_REGISTER_PERIOD:1m}
    geocoding:
      capacity: ${RATE_LIMIT_GEOCODING_CAPACITY:3}
      period: ${RATE_LIMIT_GEOCODING_PERIOD:1m}
    bucket-idle-ttl: ${RATE_LIMIT_BUCKET_IDLE_TTL:15m}
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}
  logging:
    correlation-header: X-Correlation-ID
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    root: INFO
    com.foody: INFO
