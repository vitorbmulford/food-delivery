services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foody_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-foody}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foody_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foody_delivery}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foody}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foody_local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}
      JWT_ISSUER: ${JWT_ISSUER:-foody-delivery}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: "${NOMINATIM_USER_AGENT:-foody-delivery/1.0 (+https://github.com/vitorbmulford/food-delivery)}"
      NOMINATIM_CONNECT_TIMEOUT: ${NOMINATIM_CONNECT_TIMEOUT:-2s}
      NOMINATIM_READ_TIMEOUT: ${NOMINATIM_READ_TIMEOUT:-5s}
      NOMINATIM_RETRY_MAX_ATTEMPTS: ${NOMINATIM_RETRY_MAX_ATTEMPTS:-3}
      NOMINATIM_RETRY_INITIAL_DELAY: ${NOMINATIM_RETRY_INITIAL_DELAY:-1s}
      NOMINATIM_RETRY_MAX_DELAY: ${NOMINATIM_RETRY_MAX_DELAY:-5s}
      NOMINATIM_RETRY_MULTIPLIER: ${NOMINATIM_RETRY_MULTIPLIER:-2.0}
      NOMINATIM_RETRY_JITTER: ${NOMINATIM_RETRY_JITTER:-0.2}
      NOMINATIM_CIRCUIT_WINDOW: ${NOMINATIM_CIRCUIT_WINDOW:-10}
      NOMINATIM_CIRCUIT_MIN_CALLS: ${NOMINATIM_CIRCUIT_MIN_CALLS:-5}
      NOMINATIM_CIRCUIT_FAILURE_RATE: ${NOMINATIM_CIRCUIT_FAILURE_RATE:-50}
      NOMINATIM_CIRCUIT_OPEN_DURATION: ${NOMINATIM_CIRCUIT_OPEN_DURATION:-30s}
      NOMINATIM_CIRCUIT_HALF_OPEN_CALLS: ${NOMINATIM_CIRCUIT_HALF_OPEN_CALLS:-2}
      RATE_LIMIT_LOGIN_CAPACITY: ${RATE_LIMIT_LOGIN_CAPACITY:-10}
      RATE_LIMIT_LOGIN_PERIOD: ${RATE_LIMIT_LOGIN_PERIOD:-1m}
      RATE_LIMIT_REGISTER_CAPACITY: ${RATE_LIMIT_REGISTER_CAPACITY:-5}
      RATE_LIMIT_REGISTER_PERIOD: ${RATE_LIMIT_REGISTER_PERIOD:-1m}
      RATE_LIMIT_GEOCODING_CAPACITY: ${RATE_LIMIT_GEOCODING_CAPACITY:-3}
      RATE_LIMIT_GEOCODING_PERIOD: ${RATE_LIMIT_GEOCODING_PERIOD:-1m}
      RATE_LIMIT_BUCKET_IDLE_TTL: ${RATE_LIMIT_BUCKET_IDLE_TTL:-15m}
      RATE_LIMIT_MAX_BUCKETS: ${RATE_LIMIT_MAX_BUCKETS:-10000}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
